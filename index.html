  <!-- Canonical must exist in the STATIC html. useDocumentMetadata sets one at
       runtime, but crawlers that do not execute JS never see it. -->
  <link rel="canonical" href="https://happywedz.com/" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/logo-no-bg.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- LCP image: preload so it downloads before the JS bundle parses.
       The srcset/sizes must stay identical to the <img> in Herosection.jsx,
       otherwise the browser downloads the hero twice. -->
  <link rel="preload" as="image" href="/hero-2.webp" fetchpriority="high"
    imagesrcset="/hero-2-640.webp 640w, /hero-2-960.webp 960w, /hero-2-1280.webp 1280w, /hero-2-1600.webp 1600w, /hero-2.webp 2000w"
    imagesizes="100vw" />

  <!-- Keep to 4 preconnects. The API and the image host are both hit within the
       first second; cdnjs (Font Awesome) is deferred, so it does not need one. -->
  <link rel="preconnect" href="https://happywedz.com" crossorigin />
  <!-- No crossorigin here: this host only serves plain <img> tags, which use a
       non-CORS connection. A crossorigin preconnect would open the wrong socket. -->
  <link rel="preconnect" href="https://happywedzbackend.happywedz.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!--

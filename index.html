  <!-- LCP: hero background lives in /public so the preload scanner can fetch it
       immediately, instead of waiting for the Home chunk to evaluate. One
       preload per breakpoint so a 412px phone doesn't pull the 1280px file
       (119KB) when the 768px one (48KB) is what it will render.
       Keep the `media` conditions in sync with `.hero-search--default` in
       src/App.critical.css. -->
  <!-- fetchpriority=high is load-bearing. The measured LCP element is React's
       `<section class="hero-search">`, NOT the static shell below — Chrome does
       not credit the shell's paint, because the shell is removed from the DOM
       before the metric is finalised. Dropping this attribute on the assumption
       that the shell owned LCP moved LCP from 3.6s to 5.3s in one step, and
       Lighthouse fails the "LCP request discovery" audit without it. -->
  <link rel="preload" as="image" href="/images/hero/hero-768.webp" media="(max-width: 767.98px)"
    fetchpriority="high" />
  <link rel="preload" as="image" href="/images/hero/hero-1280.webp"
    media="(min-width: 768px) and (max-width: 1599.98px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/images/hero/hero-2000.webp" media="(min-width: 1600px)"
    fetchpriority="high" />

  <!-- Brand font: preload the weights used during initial paint.
       These are NOT optional, and removing them is a trap worth documenting.
       The reasoning for dropping them was that "AirbnbCereal Fallback" in
       App.critical.css is metric-matched, so the swap should be free. It is not:
       that fallback carries a single set of metrics derived from the 400 weight,
       so 500/700 text still re-metrics when the real font arrives. With these
       preloads the fonts land before React paints and nothing shifts. Without
       them they land ~2.6s in, after the hero and search form have rendered, and
       Lighthouse attributed a 0.072 layout shift on the search column directly to
       these four files — CLS 0 -> 0.072 and TBT 0 -> 370ms (651ms of Style &
       Layout) in a single change.
       They do cost ~112KB against the LCP image. That trade is worth it at the
       current weights (CLS+TBT are 55% of the score, LCP 25%). The right way to
       reclaim it is per-weight metric-matched fallbacks, not deleting these.

       fetchpriority="low" is the compromise that keeps both. Preloaded fonts
       default to High priority, so 114KB of them raced the 22KB LCP hero image
       over the same connection. Low priority still starts them here, early
       enough to land ~1.3s in — long before React renders any text at ~2.5s, so
       there is still no swap to shift — while letting the hero image, which is
       High, take the bandwidth first. All five weights 300-700 are used above
       the fold, so none of these can simply be dropped. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/AirbnbCereal_W_Lt.woff2" crossorigin
    fetchpriority="low" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/AirbnbCereal_W_Bk.woff2" crossorigin
    fetchpriority="low" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/AirbnbCereal_W_Md.woff2" crossorigin
    fetchpriority="low" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/AirbnbCereal_W_Bd.woff2" crossorigin
    fetchpriority="low" />

  <!-- Fonts: loaded async so they never block first paint. Previously these were
       CSS @import rules inside App.css/index.css, which serialised behind the bundle.
       Poppins used to be requested here alongside Inter and was dead weight — four
       weights fetched for a face nothing could ever resolve to, because
       `* { font-family: var(--rubik-font) }` in App.critical.css beats index.css's
       Poppins rule and --rubik-font's own "AirbnbCereal Fallback" (local Arial)
       always resolves before reaching Poppins in the stack. Inter stays: three
       lazy-loaded pages ask for it by name. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />

  <!-- BRANDED SPLASH — the first thing painted on every load.
       ==================================================================
       #root is empty until ~590KB of JS (the entry chunk plus react-vendor)
       has downloaded, parsed and executed, so without something here the
       document renders as blank white for that whole window. This is a static,
       markup-only copy of src/components/ui/Loader.jsx — same logo, same 100px
       box, same flipScale keyframes — so that when React's own <Loader> is
       showing during a route transition the two are indistinguishable.

       It is drawn from the document alone, with no network dependency at all:
       the logo is inlined below as a data URI, so the splash paints the instant
       the HTML parses rather than after a round trip for /logo-no-bg.png. That
       matters — a splash that waits on a file is a white screen first, which is
       the exact thing it exists to prevent.

       It is position: fixed, so it contributes nothing to layout and removing
       it cannot shift the page — CLS stays at 0. Removal is driven by
       LoaderContext.jsx, on the first frame after React commits.

       PERFORMANCE — READ BEFORE TUNING
       ---------------------------------
       This deliberately gives up an LCP optimisation, and the reasoning is
       recorded so it is not re-derived from scratch or reverted by accident.

       What used to be here was a static copy of the *hero* — the pink nav band,
       the hero-*.webp background and the "Discover Your Dream Wedding Vendor"
       headline. That existed because the measured LCP element is React's
       <section class="hero-search">, which on Lighthouse's throttled mobile
       profile does not exist until 5.7s. Painting a full-viewport copy of it
       from markup moved LCP to the document's own paint and was worth roughly
       LCP 0.16 -> a passing score, i.e. most of the gap to 95+.

       A 100px logo centred on white cannot do that job: it is far too small to
       be the largest contentful paint, so LCP falls back to React's hero at
       ~5.7s. FCP stays fast (the splash paints at ~100ms) and CLS stays at 0,
       but expect the Lighthouse LCP subscore to drop back to roughly what it
       was before the hero shell was introduced.

       That trade was requested deliberately — brand-consistent loading over the
       LCP subscore. If the score is needed back, the hero shell is in git
       history; the two cannot both be first, because an opaque splash measures
       as 0% visually complete no matter what is underneath it.

       The hero-*.webp preloads in <head> are deliberately KEPT. They matter
       more now, not less: React's hero is the LCP element again, so those
       preloads are the only thing giving it a head start. -->
  <style>
    #app-shell { position: fixed; inset: 0; z-index: 999999; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity .25s ease-out; }
    /* Matches Loader.jsx's 100x100 box and flipScale animation exactly, so a
       route-transition loader appearing right after this one does not jump. */
    #app-shell .as-logo { width: 100px; height: 100px; animation: as-flip 2s ease-in-out infinite; }
    @keyframes as-flip {
      0% { transform: scale(1) rotateY(0deg); }
      50% { transform: scale(1.5) rotateY(180deg); }
      100% { transform: scale(1) rotateY(360deg); }
    }
    @media (prefers-reduced-motion: reduce) { #app-shell .as-logo { animation: none; } }
  </style>
  <!-- The logo is inlined rather than referenced, which is the opposite of the
       rule that applied to the old hero background — that one had to stay a file.
       The difference is size, and the reason is Lantern, Lighthouse's simulation
       of TCP slow-start: a document that fits in the initial congestion window
       (~14KB) lands in one flight, and one that does not pays ~150ms per extra
       round trip. The hero was 22KB and blew straight past it (measured twice,
       worst case Lighthouse 90 -> 76). This logo is 3.5KB, ~4.7KB base64, taking
       the document from 6.0KB to 9.3KB gzipped (measured) — still one flight, so
       it costs nothing, and it buys a splash with zero network dependency:
       FCP lands at ~88ms with no resource request for the logo at all.
       If you swap the logo, re-check that number before assuming it still fits. -->

<!DOCTYPE html>
<html lang="en-IN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HappyWedz - Find Top Wedding Vendors, Venues & Planning Tools</title>
  <meta name="title" content="HappyWedz - Find Top Wedding Vendors, Venues & Planning Tools" />
  <meta name="description"
    content="Discover top-rated wedding vendors, venues, and planning tools for your perfect wedding. Explore real weddings, inspiration, and expert advice with HappyWedz." />

  <!-- Dynamic meta, canonical, open graph, and twitter tags are handled per-page by SEO component (react-helmet-async) -->

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/logo-no-bg.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Dynamic canonical link is managed per-page by SEO component (react-helmet-async) -->

  <!-- Preconnect to external origins the first paint depends on -->
  <link rel="preconnect" href="https://happywedzbackend.happywedz.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- LCP: hero background lives in /public so the preload scanner can fetch it
       immediately, instead of waiting for the Home chunk to evaluate. One
       preload per breakpoint so a 412px phone doesn't pull the 1280px file
       (119KB) when the 768px one (48KB) is what it will render.
       Keep the `media` conditions in sync with `.hero-search--default` in
       src/App.critical.css. -->
  <link rel="preload" as="image" href="/images/hero/hero-768.webp" media="(max-width: 767.98px)"
    fetchpriority="high" />
  <link rel="preload" as="image" href="/images/hero/hero-1280.webp"
    media="(min-width: 768px) and (max-width: 1599.98px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/images/hero/hero-2000.webp" media="(min-width: 1600px)"
    fetchpriority="high" />

  <!-- Brand font: preload key weights used during initial paint (300, 400, 500, 700) -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/AirbnbCereal_W_Lt.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/AirbnbCereal_W_Bk.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/AirbnbCereal_W_Md.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/AirbnbCereal_W_Bd.woff2" crossorigin />

  <!-- Fonts: loaded async so they never block first paint. Previously these were
       CSS @import rules inside App.css/index.css, which serialised behind the bundle. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" />
  </noscript>

  <!-- Font Awesome was render-blocking (~470ms). Load it out of the critical path. -->
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous" referrerpolicy="no-referrer" />
  </noscript>

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "HappyWedz Wedding Packages",
        "description": "Affordable and customizable destination wedding packages in Pune, Lonavala, Goa, and Rajasthan by HappyWedz.",
        "url": "https://happywedz.com/",
        "numberOfItems": 3,
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "item": {
              "@type": "Product",
              "name": "Classic Wedding Package",
              "description": "Perfect for intimate or local weddings, including venue coordination, decoration, photography, and catering for up to 100 guests.",
              "brand": { "@type": "Brand", "name": "HappyWedz" },
              "offers": {
                "@type": "Offer",
                "url": "https://happywedz.com/packages",
                "priceCurrency": "INR",
                "price": "49999",
                "priceValidUntil": "2025-12-31",
                "availability": "https://schema.org/InStock",
                "itemCondition": "https://schema.org/NewCondition"
              }
            }
          },
          {
            "@type": "ListItem",
            "position": 2,
            "item": {
              "@type": "Product",
              "name": "Destination Wedding Package",
              "description": "Ideal for luxury weddings in Goa, Lonavala, and Rajasthan. Includes decor, logistics, guest management, and full event coordination.",
              "brand": { "@type": "Brand", "name": "HappyWedz" },
              "offers": {
                "@type": "Offer",
                "url": "https://happywedz.com/destination-wedding",
                "priceCurrency": "INR",
                "price": "149999",
                "priceValidUntil": "2025-12-31",
                "availability": "https://schema.org/InStock",
                "itemCondition": "https://schema.org/NewCondition"
              }
            }
          },
          {
            "@type": "ListItem",
            "position": 3,
            "item": {
              "@type": "Product",
              "name": "Luxury Wedding Experience Package",
              "description": "A premium package offering designer decor, celebrity entertainment, and luxury hospitality for elite weddings.",
              "brand": { "@type": "Brand", "name": "HappyWedz" },
              "offers": {
                "@type": "Offer",
                "url": "https://happywedz.com/luxury-wedding",
                "priceCurrency": "INR",
                "price": "299999",
                "priceValidUntil": "2025-12-31",

          }
        ]
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- The Trustpilot bootstrap script is injected by src/components/layouts/Footer.jsx
       when the widget scrolls near the viewport. Loading it here (even `async`)
       cost ~124ms of forced reflow during page load. -->

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What services does HappyWedz offer for destination weddings?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "HappyWedz provides complete destination wedding planning services including venue selection, decor, catering, photography, and guest logistics."
            }
          },
          {
            "@type": "Question",
            "name": "In which locations does HappyWedz operate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "HappyWedz organizes weddings in Goa, Lonavala, Mahabaleshwar, Nashik, Pune, and Rajasthan."
            }
          },
          {
            "@type": "Question",
            "name": "How much does wedding planning through HappyWedz cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Packages start around ₹49,999 depending on location, guest count, and decor preferences."
            }
          },
          {
            "@type": "Question",
            "name": "Can HappyWedz manage local weddings?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, HappyWedz also plans and manages local weddings with full vendor and logistics support."
            }
          }
        ]
      }
    </script>
</body>

</html>

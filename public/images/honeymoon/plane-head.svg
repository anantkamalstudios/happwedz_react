<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Plane nose/cockpit -->
  <ellipse cx="100" cy="40" rx="80" ry="35" fill="#E8F4F8" stroke="#0D6EFD" stroke-width="2"/>
  <ellipse cx="100" cy="40" rx="60" ry="25" fill="#FFFFFF" stroke="#0D6EFD" stroke-width="1.5"/>
  
  <!-- Cockpit windows -->
  <ellipse cx="90" cy="35" rx="12" ry="10" fill="#0D6EFD" opacity="0.3"/>
  <ellipse cx="110" cy="35" rx="12" ry="10" fill="#0D6EFD" opacity="0.3"/>
  
  <!-- Decorative lines -->
  <line x1="40" y1="40" x2="160" y2="40" stroke="#0D6EFD" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="50" x2="150" y2="50" stroke="#0D6EFD" stroke-width="1" opacity="0.2"/>
  <line x1="50" y1="30" x2="150" y2="30" stroke="#0D6EFD" stroke-width="1" opacity="0.2"/>
</svg>

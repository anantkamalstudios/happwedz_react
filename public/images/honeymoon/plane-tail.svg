<svg width="200" height="100" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tail body -->
  <rect x="70" y="30" width="60" height="40" fill="#E8F4F8" stroke="#0D6EFD" stroke-width="2" rx="4"/>
  
  <!-- Vertical stabilizer (tail fin) -->
  <path d="M 100 30 L 100 5 L 120 15 L 100 30 Z" fill="#0D6EFD" opacity="0.7"/>
  
  <!-- Horizontal stabilizers (wings) -->
  <ellipse cx="100" cy="50" rx="70" ry="15" fill="#E8F4F8" stroke="#0D6EFD" stroke-width="2"/>
  
  <!-- Decorative lines -->
  <line x1="70" y1="50" x2="130" y2="50" stroke="#0D6EFD" stroke-width="1" opacity="0.3"/>
  <line x1="75" y1="40" x2="125" y2="40" stroke="#0D6EFD" stroke-width="1" opacity="0.2"/>
  <line x1="75" y1="60" x2="125" y2="60" stroke="#0D6EFD" stroke-width="1" opacity="0.2"/>
  
  <!-- Engine details -->
  <circle cx="50" cy="50" r="8" fill="#0D6EFD" opacity="0.5"/>
  <circle cx="150" cy="50" r="8" fill="#0D6EFD" opacity="0.5"/>
</svg>
